site_name: Overkill Factory
site_description: Documentação pública da Overkill Factory.
docs_dir: .
site_dir: ../site
strict: true

theme:
  name: mkdocs

nav:
  - Início: index.md
  - Português:
      - Overkill Factory: pt-BR/index.md
      - Manual: pt-BR/manual.md
      - Linha de produção: pt-BR/linha-de-producao.md
      - Uso: pt-BR/uso.md
      - Para mantenedores: pt-BR/para-mantenedores.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
