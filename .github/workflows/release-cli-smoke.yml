name: release-cli-smoke

on:
  pull_request:
    paths:
      - "README.md"
      - "factory/pyproject.toml"
      - "factory/adapters/**"
      - "factory/agents/**"
      - "docs/**"
      - "factory/examples/**"
      - "factory/fixtures/**"
      - "factory/schemas/**"
      - "factory/scripts/**"
      - "factory/skills/**"
      - "factory/templates/**"
      - ".github/workflows/release-cli-smoke.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install package from clean checkout
        run: python -m pip install ./factory
      - name: CLI smoke outside checkout
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "overkill-factory-cli-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          factoryctl --help
          factoryctl doctor --json
          factoryctl run minimal --out (Join-Path $smoke "quickstart-result.json") --packets-out (Join-Path $smoke "packets")
          overkill-quickstart --out (Join-Path $smoke "quickstart-result-compat.json") --packets-out (Join-Path $smoke "packets-compat")
          Pop-Location
      - name: Public safety before publication
        run: python scripts/public_safety_scan.py
        working-directory: factory
      - name: Secret safety before publication
        run: python scripts/secret_safety_scan.py
        working-directory: factory
